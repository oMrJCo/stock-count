<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>ตรวจนับสต็อก</title>
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:#f3f6fa;color:#14213d}.top{height:44px;background:#102f5f;color:#fff;padding:8px 12px;display:flex;align-items:center;justify-content:space-between}.screen{height:calc(100svh - 44px);max-width:520px;margin:auto;padding:7px;display:grid;grid-template-rows:auto minmax(0,1fr) auto;gap:7px;overflow:hidden}.card{background:#fff;border:1px solid #d9e2ef;border-radius:13px;padding:9px}.login{display:block;height:auto;margin:16px auto;max-width:480px}.login>*{width:100%;margin:5px 0}.hide{display:none!important}input,select,button{font:inherit;font-size:16px;border-radius:10px;border:1px solid #cbd7e6;padding:11px}button{border:0;background:#1769df;color:#fff;font-weight:800}.secondary{background:#edf3fa;color:#18375f}.bad{color:#c93434}.muted{color:#6d7b91}.status{font-size:12px}.last{display:flex;align-items:center;justify-content:space-between}.workarea{display:flex;flex-direction:column;min-height:0;gap:7px}.workarea.item-open .camera{flex:0 0 185px;min-height:185px}.workarea.item-open #cameraActions{display:none!important}.camera{position:relative;flex:1;min-height:180px;background:#07101d;border-radius:12px;overflow:hidden}.camera #reader{width:100%;height:100%}.camera video{width:100%!important;height:100%!important;object-fit:cover}.scanline{pointer-events:none;position:absolute;inset:17% 8%;border:2px solid #fff;border-radius:14px;box-shadow:0 0 0 999px rgba(0,0,0,.16)}.camlabel{position:absolute;left:50%;bottom:10px;transform:translateX(-50%);background:rgba(0,0,0,.62);color:#fff;border-radius:20px;padding:6px 12px;font-size:13px;white-space:nowrap}.actions{display:flex;gap:7px}.actions button{flex:1}.manual{display:flex;gap:7px}.manual input{min-width:0;flex:1}.productbox{background:#fff;border:1px solid #d9e2ef;border-radius:12px;padding:10px;text-align:center}.notfoundbox{background:#fff3f3;border:1px solid #efb7b7;border-radius:12px;padding:12px;text-align:center}.notfoundbox b{display:block;font-size:20px;color:#b42318;margin-bottom:4px}.notfoundbox button{width:100%;margin-top:8px}.code{font-size:14px;color:#6d7b91}.name{font-size:20px;font-weight:900;line-height:1.2;margin:4px 0 8px}.qtyrow{display:grid;grid-template-columns:105px 1fr 1fr;gap:8px;align-items:stretch}.qty{width:100%;text-align:center;font-size:28px;font-weight:900}.okbtn{font-size:20px}.cancelbtn{width:100%;margin:0;font-size:16px}.hint{font-size:13px;color:#6d7b91}.success{font-weight:800;color:#15864b}.lang{display:flex;gap:4px;margin-left:auto;margin-right:8px}.lang button{padding:5px 8px;font-size:12px;background:#fff;color:#102f5f}.lang button.on{background:#ffd84d;color:#10213c}
</style></head><body>
<header class="top"><b id="topTitle">📦 ตรวจนับสต็อก</b><div class="lang"><button id="thBtn">TH</button><button id="zhBtn">中文</button></div><span id="branch">—</span></header>
<div id="login" class="card login"><h2 id="loginTitle">เริ่มตรวจนับ</h2><div id="round" class="muted">กำลังโหลดรอบ...</div><input id="worker" placeholder="ชื่อผู้ตรวจนับ"><input id="area" type="hidden" value=""><button id="start">เริ่มตรวจนับ</button><div id="err" class="bad"></div></div>
<main id="work" class="screen hide">
<section class="card last"><div><b id="identity"></b><div id="round2" class="muted status"></div></div><button id="change" class="secondary">เปลี่ยน</button></section>
<section class="workarea">
<div id="camera" class="camera"><div id="reader"></div><div class="scanline"></div><div id="camlabel" class="camlabel">กำลังเปิดกล้อง…</div></div>
<div class="actions"><button id="cameraMode">📷 กล้อง</button><button id="gunMode" class="secondary">▥ เครื่องยิง</button></div><div id="cameraActions" class="actions"><button id="scanBtn">สแกน</button><button id="manualBtn" class="secondary">พิมพ์รหัส</button></div>
<div id="manualBox" class="manual hide"><input id="code" placeholder="พิมพ์ Barcode / รหัสสินค้า" autocomplete="off"><button id="manualGo">ตกลง</button></div>
<div id="notFoundBox" class="notfoundbox hide"><b id="notFoundTitle">ไม่พบสินค้า</b><div id="notFoundCode" class="code"></div><button id="notFoundClose" class="secondary">ปิด / สแกนใหม่</button></div><div id="productBox" class="productbox hide"><div id="selectedCode" class="code"></div><div id="selectedName" class="name"></div><div class="qtyrow"><input id="qty" class="qty" type="number" inputmode="numeric" min="0" placeholder="จำนวน"><button id="save" class="okbtn">ตกลง</button><button id="cancelItem" class="secondary cancelbtn">ยกเลิก</button></div></div>
</section>
<section class="card last"><div><small id="latestLabel" class="muted">ล่าสุด</small><div id="latest"><b>—</b></div></div><button id="undo" class="secondary">↶ ย้อน</button></section>
</main>
<script>
var API="https://dxlngxkuggbgdzmithzx.supabase.co/rest/v1/rpc/";
var KEY="sb_publishable_sqAwuko-g-Kgzp51YyMT3g_gIAwtEan";
function getParam(name){var m=new RegExp("[?&]"+name+"=([^&]*)").exec(location.search);return m?decodeURIComponent(m[1].replace(/\+/g," ")):""}
var token=getParam("s"),session=null,lastEvent=null,operator="",selected=null,scanner=null,scanning=false,busy=false,mode="camera",workerKey="sc_worker_"+(token||"default");
function $(id){return document.getElementById(id)}
var lang=localStorage.getItem("sc_lang")||"th";
var TX={
th:{top:"📦 ตรวจนับสต็อก",login:"เริ่มตรวจนับ",worker:"ชื่อผู้ตรวจนับ",start:"เริ่มตรวจนับ",change:"เปลี่ยน",scan:"สแกน",manual:"พิมพ์รหัส",manualph:"พิมพ์ Barcode / รหัสสินค้า",ok:"ตกลง",qty:"จำนวน",latest:"ล่าสุด",undo:"↶ ย้อน",camera:"📷 กล้อง",gun:"▥ เครื่องยิง",opening:"กำลังเปิดกล้อง…",aim:"เล็งบาร์โค้ดให้อยู่ในกรอบ",camfail:"เปิดกล้องไม่ได้ • ใช้พิมพ์รหัสแทน",camask:"กำลังขออนุญาตใช้กล้อง…",camdenied:"ไม่ได้รับอนุญาตใช้กล้อง • ตรวจสอบสิทธิ์กล้องของ Safari",searching:"กำลังค้นหา…",notfound:"ไม่พบสินค้า",notfoundclose:"ปิด / สแกนใหม่",found:"พบสินค้าแล้ว • ใส่จำนวน",searchfail:"ค้นหาไม่สำเร็จ",needname:"ใส่ชื่อผู้ตรวจนับก่อน",nolink:"ลิงก์นี้ยังไม่ได้ผูกกับรอบตรวจนับ",noround:"ไม่พบรอบตรวจนับ",closed:"ปิดรอบแล้ว",saved:"บันทึก",savefail:"บันทึกไม่สำเร็จ",cancelitem:"ยกเลิก"},
zh:{top:"📦 库存盘点",login:"开始盘点",worker:"盘点人员姓名",start:"开始盘点",change:"更换",scan:"扫描",manual:"手动输入",manualph:"输入条码 / 商品编码",ok:"确认",qty:"数量",latest:"最近记录",undo:"↶ 撤销",camera:"📷 相机",gun:"▥ 扫码枪",opening:"正在打开相机…",aim:"请将条码对准扫描框",camfail:"无法打开相机 • 请手动输入",camask:"正在请求相机权限…",camdenied:"相机权限未开启 • 请检查 Safari 相机权限",searching:"正在查找…",notfound:"未找到商品",notfoundclose:"关闭 / 重新扫描",found:"已找到商品 • 请输入数量",searchfail:"查找失败",needname:"请先输入盘点人员姓名",nolink:"此链接尚未绑定盘点任务",noround:"未找到盘点任务",closed:"已关闭",saved:"已保存",savefail:"保存失败",cancelitem:"取消"}
};
function t(k){return TX[lang][k]||k}
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(ch){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[ch]})}
function rpc(fn,body,ok,fail){
  var x=new XMLHttpRequest();
  x.open("POST",API+fn,true);
  x.setRequestHeader("Content-Type","application/json");
  x.setRequestHeader("apikey",KEY);
  x.onreadystatechange=function(){
    if(x.readyState!==4)return;
    if(x.status>=200&&x.status<300){
      var d=null;try{d=JSON.parse(x.responseText)}catch(e){d=x.responseText}
      if(ok)ok(d);
    }else{if(fail)fail(x.responseText||("HTTP "+x.status))}
  };
  try{x.send(JSON.stringify(body))}catch(e){if(fail)fail(String(e))}
}
function applyLang(){
  document.documentElement.lang=lang==="zh"?"zh-CN":"th";
  $("topTitle").innerHTML=t("top");$("loginTitle").innerHTML=t("login");$("worker").placeholder=t("worker");
  $("start").innerHTML=t("start");$("change").innerHTML=t("change");$("scanBtn").innerHTML=t("scan");
  $("manualBtn").innerHTML=t("manual");$("code").placeholder=t("manualph");$("manualGo").innerHTML=t("ok");
  $("qty").placeholder=t("qty");$("save").innerHTML=t("ok");$("cancelItem").innerHTML=t("cancelitem");$("notFoundTitle").innerHTML=t("notfound");$("notFoundClose").innerHTML=t("notfoundclose");$("latestLabel").innerHTML=t("latest");$("undo").innerHTML=t("undo");
  $("cameraMode").innerHTML=t("camera");$("gunMode").innerHTML=t("gun");
  $("thBtn").className=lang==="th"?"on":"";$("zhBtn").className=lang==="zh"?"on":"";
}
function setLang(x){lang=x;localStorage.setItem("sc_lang",x);applyLang();if(session)$("round").innerHTML=esc(session.name)+" • "+esc(session.count_date)+(session.status!=="open"?" • "+t("closed"):"")}
function init(){
  applyLang();
  try{var savedWorker=localStorage.getItem(workerKey)||"";if(savedWorker)$("worker").value=savedWorker}catch(e){}
  if(!token){$("round").innerHTML=t("nolink");$("start").disabled=true;return}
  rpc("sc_counter_info",{p_token:token},function(s){
    session=s;if(!session){$("round").innerHTML=t("noround");$("start").disabled=true;return}
    $("branch").innerHTML=esc(session.branch||"Stock Count");
    $("round").innerHTML=esc(session.name)+" • "+esc(session.count_date)+(session.status!=="open"?" • "+t("closed"):"");
    $("area").value=(session.areas&&session.areas.length)?session.areas[0]:"";
    if(session.status!=="open")$("start").disabled=true;
  },function(){ $("round").innerHTML=t("noround");$("start").disabled=true; });
}
function showWork(){
  operator=$("worker").value.replace(/^\s+|\s+$/g,"");
  if(!operator){$("err").innerHTML=t("needname");return}try{localStorage.setItem(workerKey,operator)}catch(e){}
  if(!session){$("err").innerHTML=t("noround");return}
  $("identity").innerHTML=esc(operator);$("round2").innerHTML=esc(session.name);
  $("login").className+=" hide";$("work").className=$("work").className.replace(/\bhide\b/g,"");
  setMode("gun");
}
function launchScanner(){
  if(scanning)return;
  if(typeof Html5Qrcode==="undefined"){$("camlabel").innerHTML=t("camfail");return}
  try{
    if(!scanner)scanner=new Html5Qrcode("reader",{formatsToSupport:[
Html5QrcodeSupportedFormats.CODE_128,
Html5QrcodeSupportedFormats.CODE_39,
Html5QrcodeSupportedFormats.CODE_93,
Html5QrcodeSupportedFormats.EAN_13,
Html5QrcodeSupportedFormats.EAN_8,
Html5QrcodeSupportedFormats.UPC_A,
Html5QrcodeSupportedFormats.UPC_E,
Html5QrcodeSupportedFormats.ITF,
Html5QrcodeSupportedFormats.CODABAR,
Html5QrcodeSupportedFormats.QR_CODE
]});
    scanner.start({facingMode:"environment"},{fps:20,qrbox:{width:320,height:110},disableFlip:true},function(code){onScan(code)},function(){})
      .then(function(){scanning=true;$("camlabel").innerHTML=t("aim")})
      .catch(function(err){$("camlabel").innerHTML=t("camfail")});
  }catch(e){$("camlabel").innerHTML=t("camfail")}
}
function startCamera(){
  if(scanning)return;
  $("camlabel").innerHTML=t("camask");
  if(navigator.mediaDevices&&navigator.mediaDevices.getUserMedia){
    navigator.mediaDevices.getUserMedia({video:{facingMode:"environment"},audio:false}).then(function(stream){
      var tracks=stream.getTracks();for(var i=0;i<tracks.length;i++)tracks[i].stop();
      launchScanner();
    }).catch(function(err){
      $("camlabel").innerHTML=(err&&err.name==="NotAllowedError")?t("camdenied"):t("camfail");
    });
  }else{
    launchScanner();
  }
}
function ensureCamera(){
  if(mode!=="camera")return;
  var v=document.querySelector("#reader video"),track=null;
  try{track=v&&v.srcObject&&v.srcObject.getVideoTracks?v.srcObject.getVideoTracks()[0]:null}catch(e){}
  if(track&&track.readyState==="live"){scanning=true;return}
  scanning=false;
  try{if(scanner&&scanner.clear)scanner.clear()}catch(e){}
  scanner=null;
  $("reader").innerHTML="";
  setTimeout(function(){launchScanner()},80);
}
function setMode(m){
  mode=m;
  $("cameraMode").className=m==="camera"?"":"secondary";
  $("gunMode").className=m==="gun"?"":"secondary";
  $("camera").className=m==="gun"?"camera hide":"camera";
  $("cameraActions").className=m==="gun"?"actions hide":"actions";
  $("manualBox").className=m==="gun"?"manual":"manual hide";
  if(m==="gun"){busy=false;$("code").value="";setTimeout(function(){$("code").focus()},50)}else startCamera();
}
function resumeScan(){selected=null;busy=false;$("productBox").className="productbox hide";document.querySelector(".workarea").className="workarea";$("qty").value="";$("camlabel").innerHTML=t("aim");ensureCamera()}
function onScan(code){if(busy||selected)return;lookup(String(code).replace(/^\s+|\s+$/g,""))}
function lookup(code){
  if(!code||busy)return;busy=true;$("camlabel").innerHTML=t("searching");
  rpc("sc_lookup",{p_token:token,p_code:code},function(x){
    if(!x||!x.found){
      if(mode==="gun"){alert(t("notfound")+"\n"+code);busy=false;$("code").focus()}
      else{
        $("notFoundCode").innerHTML=esc(code);
        $("notFoundBox").className="notfoundbox";
        document.querySelector(".workarea").className="workarea item-open";
        $("camlabel").innerHTML=t("notfound");
        try{if(scanner&&scanner.pause)scanner.pause(true)}catch(e){}
      }
      return;
    }
    selected=x;$("selectedCode").innerHTML=esc(x.code);$("selectedName").innerHTML=esc(x.product_name);$("qty").value="";
    $("productBox").className="productbox";document.querySelector(".workarea").className="workarea item-open";$("camlabel").innerHTML=t("found");setTimeout(function(){$("qty").focus()},30);
  },function(){busy=false;$("camlabel").innerHTML=t("searchfail");if(mode==="gun")$("code").focus()});
}
function save(){
  if(!selected)return;var qty=Number($("qty").value);if(isNaN(qty)||qty<0){$("qty").focus();return}
  var item=selected;
  rpc("sc_count",{p_token:token,p_code:item.code,p_operator:operator,p_area:$("area").value,p_qty:qty},function(x){
    lastEvent=x.event_id;$("latest").innerHTML="<b>"+esc(x.code)+"</b> +"+qty;$("camlabel").innerHTML="✓ "+t("saved")+" "+qty;
    $("productBox").className="productbox hide";document.querySelector(".workarea").className="workarea";selected=null;$("qty").value="";
    setTimeout(function(){busy=false;$("camlabel").innerHTML=t("aim");if(mode==="gun")$("code").focus();else ensureCamera()},300);
  },function(err){busy=false;$("camlabel").innerHTML=t("savefail");alert(t("savefail"));$("qty").focus()});
}
function undo(){if(!lastEvent)return;rpc("sc_undo",{p_token:token,p_event:lastEvent,p_operator:operator},function(ok){if(ok){$("latest").innerHTML="<b>—</b>";lastEvent=null}if(mode==="gun")$("code").focus()})}
$("start").onclick=showWork;$("change").onclick=function(){try{localStorage.removeItem(workerKey)}catch(e){}location.reload()};
$("cameraMode").onclick=function(){mode="camera";$("cameraMode").className="";$("gunMode").className="secondary";$("camera").className="camera";$("cameraActions").className="actions";$("manualBox").className="manual hide";startCamera()};$("gunMode").onclick=function(){setMode("gun")};
$("scanBtn").onclick=function(){if(selected)resumeScan();else{busy=false;$("camlabel").innerHTML=t("aim");startCamera()}};
$("manualBtn").onclick=function(){var b=$("manualBox");b.className=b.className.indexOf("hide")>=0?"manual":"manual hide";if(b.className.indexOf("hide")<0)$("code").focus()};
$("manualGo").onclick=function(){var v=$("code").value.replace(/^\s+|\s+$/g,"");$("code").value="";if(mode!=="gun")$("manualBox").className="manual hide";busy=false;lookup(v)};
$("code").onkeydown=function(e){e=e||window.event;if((e.key&&e.key==="Enter")||e.keyCode===13){if(e.preventDefault)e.preventDefault();$("manualGo").click();return false}};
$("qty").onkeydown=function(e){e=e||window.event;if((e.key&&e.key==="Enter")||e.keyCode===13){if(e.preventDefault)e.preventDefault();save();return false}};
$("notFoundClose").onclick=function(){
  $("notFoundBox").className="notfoundbox hide";
  document.querySelector(".workarea").className="workarea";
  busy=false;
  $("camlabel").innerHTML=t("aim");
  try{if(scanner&&scanner.resume)scanner.resume()}catch(e){ensureCamera()}
};
$("cancelItem").onclick=function(){selected=null;busy=false;$("productBox").className="productbox hide";document.querySelector(".workarea").className="workarea";$("qty").value="";$("selectedCode").innerHTML="";$("selectedName").innerHTML="";$("camlabel").innerHTML=t("aim");if(mode==="gun")$("code").focus();else ensureCamera()};$("save").onclick=save;$("undo").onclick=undo;$("thBtn").onclick=function(){setLang("th")};$("zhBtn").onclick=function(){setLang("zh")};
init();
</script></body></html>
