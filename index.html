<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>ตรวจนับสต็อก</title><style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:#f3f6fa;color:#14213d}.top{height:54px;background:#102f5f;color:#fff;padding:10px 14px;display:flex;align-items:center;justify-content:space-between}.screen{height:calc(100svh - 54px);max-width:520px;margin:auto;padding:8px;display:grid;grid-template-rows:auto auto 1fr auto;gap:7px;overflow:hidden}.card{background:#fff;border:1px solid #d9e2ef;border-radius:13px;padding:10px}.login{display:block;height:auto;margin:16px auto;max-width:480px}.login>*{width:100%;margin:5px 0}.hide{display:none!important}input,select,button{font:inherit;font-size:16px;border-radius:10px;border:1px solid #cbd7e6;padding:11px}button{border:0;background:#1769df;color:#fff;font-weight:700}.row{display:flex;gap:7px}.scan{width:100%;font-size:20px;border:2px solid #1769df}.product{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;min-height:0}.name{font-size:21px;font-weight:800;margin:5px}.plus{font-size:46px;font-weight:900;color:#15864b}.ok{color:#15864b}.bad{color:#c93434}.muted{color:#6d7b91}.last{display:flex;align-items:center;justify-content:space-between}.secondary{background:#edf3fa;color:#18375f}.status{font-size:12px}.qty{width:82px}</style></head><body>
<header class="top"><b>📦 ตรวจนับสต็อก</b><span id="branch">—</span></header>
<div id="login" class="card login"><h2>เริ่มตรวจนับ</h2><div id="round" class="muted">กำลังโหลดรอบ...</div><input id="worker" placeholder="ชื่อผู้ตรวจนับ"><select id="area"></select><button id="start">เริ่มตรวจนับ</button><div id="err" class="bad"></div></div>
<main id="work" class="screen hide"><section class="card last"><div><b id="identity"></b><div id="round2" class="muted status"></div></div><button id="change" class="secondary">เปลี่ยน</button></section><section class="card"><input id="code" class="scan" placeholder="ยิง / พิมพ์ Barcode" autocomplete="off"><div class="row" style="margin-top:6px"><input id="qty" class="qty" type="number" min="1" value="1"><button id="save" style="flex:1">บันทึก</button></div></section><section id="product" class="card product"><div class="muted">พร้อมตรวจนับ</div><div class="name">ยิง Barcode เพื่อเริ่ม</div><div class="muted">ค้นหารหัสแบบตรง 100%</div></section><section class="card last"><div><small class="muted">ล่าสุด</small><div id="latest"><b>—</b></div></div><button id="undo" class="secondary">↶ ย้อน</button></section></main>
<script>
const API="https://dxlngxkuggbgdzmithzx.supabase.co/rest/v1/rpc/",KEY="sb_publishable_sqAwuko-g-Kgzp51YyMT3g_gIAwtEan";const token=new URLSearchParams(location.search).get('s');let session=null,lastEvent=null,operator='';const $=id=>document.getElementById(id);
async function rpc(fn,body){let r=await fetch(API+fn,{method:'POST',headers:{'Content-Type':'application/json','apikey':KEY},body:JSON.stringify(body)});if(!r.ok)throw new Error(await r.text());return r.json()}
function esc(s){return String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
async function init(){if(!token){$('round').textContent='ลิงก์นี้ยังไม่ได้ผูกกับรอบตรวจนับ';$('start').disabled=true;return}try{session=await rpc('sc_counter_info',{p_token:token});if(!session)throw 0;$('branch').textContent=session.branch||'Stock Count';$('round').textContent=session.name+' • '+session.count_date+(session.status!=='open'?' • ปิดรอบแล้ว':'');$('area').innerHTML=(session.areas||[]).map(x=>'<option>'+esc(x)+'</option>').join('');if(session.status!=='open')$('start').disabled=true}catch(e){$('round').textContent='ไม่พบรอบตรวจนับ';$('start').disabled=true}}
$('start').onclick=()=>{operator=$('worker').value.trim();if(!operator)return $('err').textContent='ใส่ชื่อผู้ตรวจนับก่อน';$('identity').textContent=operator+' • '+$('area').value;$('round2').textContent=session.name;$('login').classList.add('hide');$('work').classList.remove('hide');$('code').focus()};$('change').onclick=()=>location.reload();$('code').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();save()}});$('save').onclick=save;
async function save(){let code=$('code').value.trim(),qty=Math.max(1,Number($('qty').value)||1);if(!code)return;try{let x=await rpc('sc_count',{p_token:token,p_code:code,p_operator:operator,p_area:$('area').value,p_qty:qty});if(!x.found){$('product').innerHTML='<div class="bad"><b>ไม่พบสินค้า</b></div><div class="name">'+esc(code)+'</div>';$('code').select();return}lastEvent=x.event_id;$('product').innerHTML='<div class="ok">✓ บันทึกแล้ว</div><div><b>'+esc(x.code)+'</b></div><div class="name">'+esc(x.product_name)+'</div><div class="plus">+'+qty+'</div>';$('latest').innerHTML='<b>'+esc(x.code)+'</b> +'+qty;$('code').value='';$('qty').value=1;$('code').focus()}catch(e){$('product').innerHTML='<div class="bad"><b>บันทึกไม่สำเร็จ</b></div>'}}
$('undo').onclick=async()=>{if(!lastEvent)return;let ok=await rpc('sc_undo',{p_token:token,p_event:lastEvent,p_operator:operator});if(ok){$('product').innerHTML='<div class="muted">ย้อนรายการล่าสุดแล้ว</div>';$('latest').innerHTML='<b>—</b>';lastEvent=null}$('code').focus()};init();
</script></body></html>
