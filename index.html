<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>ตรวจนับสต็อก</title><style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:#f3f6fa;color:#14213d}.top{height:54px;background:#102f5f;color:#fff;padding:10px 14px;display:flex;align-items:center;justify-content:space-between}.screen{height:calc(100svh - 54px);max-width:520px;margin:auto;padding:8px;display:grid;grid-template-rows:auto auto 1fr auto;gap:7px;overflow:hidden}.card{background:#fff;border:1px solid #d9e2ef;border-radius:13px;padding:10px}.login{display:block;height:auto;margin:16px auto;max-width:480px}.login>*{width:100%;margin:5px 0}.hide{display:none!important}input,select,button{font:inherit;font-size:16px;border-radius:10px;border:1px solid #cbd7e6;padding:11px}button{border:0;background:#1769df;color:#fff;font-weight:700}.row{display:flex;gap:7px}.scan{width:100%;font-size:20px;border:2px solid #1769df}.product{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;min-height:0}.name{font-size:21px;font-weight:800;margin:5px}.plus{font-size:46px;font-weight:900;color:#15864b}.ok{color:#15864b}.bad{color:#c93434}.muted{color:#6d7b91}.last{display:flex;align-items:center;justify-content:space-between}.secondary{background:#edf3fa;color:#18375f}.status{font-size:12px}.qty{width:120px;text-align:center;font-size:26px;font-weight:800}.qtybox{width:100%;max-width:360px}.qtybox label{display:block;font-weight:800;margin-bottom:6px}.savebig{width:100%;font-size:20px;padding:14px;margin-top:8px}.lookupbtn{width:120px}.scanrow{display:flex;gap:7px}.selected{font-size:14px;color:#6d7b91}</style></head><body>
<header class="top"><b>📦 ตรวจนับสต็อก</b><span id="branch">—</span></header>
<div id="login" class="card login"><h2>เริ่มตรวจนับ</h2><div id="round" class="muted">กำลังโหลดรอบ...</div><input id="worker" placeholder="ชื่อผู้ตรวจนับ"><select id="area"></select><button id="start">เริ่มตรวจนับ</button><div id="err" class="bad"></div></div>
<main id="work" class="screen hide"><section class="card last"><div><b id="identity"></b><div id="round2" class="muted status"></div></div><button id="change" class="secondary">เปลี่ยน</button></section><section class="card"><div class="scanrow"><input id="code" class="scan" placeholder="ยิง / พิมพ์ Barcode" autocomplete="off"><button id="lookup" class="lookupbtn">ค้นหา</button></div></section><section id="product" class="card product"><div class="muted">พร้อมตรวจนับ</div><div class="name">ยิง Barcode เพื่อเรียกสินค้า</div><div class="muted">ยิงแล้วระบบยังไม่บันทึกจำนวน</div><div id="qtyBox" class="qtybox hide"><div id="selectedCode" class="selected"></div><div id="selectedName" class="name"></div><label for="qty">จำนวนที่นับได้</label><input id="qty" class="qty" type="number" inputmode="numeric" min="1" value="1"><button id="save" class="savebig">บันทึกจำนวน</button></div></section><section class="card last"><div><small class="muted">ล่าสุด</small><div id="latest"><b>—</b></div></div><button id="undo" class="secondary">↶ ย้อน</button></section></main>
<script>
const API="https://dxlngxkuggbgdzmithzx.supabase.co/rest/v1/rpc/",KEY="sb_publishable_sqAwuko-g-Kgzp51YyMT3g_gIAwtEan";const token=new URLSearchParams(location.search).get('s');let session=null,lastEvent=null,operator='',selected=null;const $=id=>document.getElementById(id);
async function rpc(fn,body){let r=await fetch(API+fn,{method:'POST',headers:{'Content-Type':'application/json','apikey':KEY},body:JSON.stringify(body)});if(!r.ok)throw new Error(await r.text());return r.json()}
function esc(s){return String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
async function init(){if(!token){$('round').textContent='ลิงก์นี้ยังไม่ได้ผูกกับรอบตรวจนับ';$('start').disabled=true;return}try{session=await rpc('sc_counter_info',{p_token:token});if(!session)throw 0;$('branch').textContent=session.branch||'Stock Count';$('round').textContent=session.name+' • '+session.count_date+(session.status!=='open'?' • ปิดรอบแล้ว':'');$('area').innerHTML=(session.areas||[]).map(x=>'<option>'+esc(x)+'</option>').join('');if(session.status!=='open')$('start').disabled=true}catch(e){$('round').textContent='ไม่พบรอบตรวจนับ';$('start').disabled=true}}
$('start').onclick=()=>{operator=$('worker').value.trim();if(!operator)return $('err').textContent='ใส่ชื่อผู้ตรวจนับก่อน';$('identity').textContent=operator+' • '+$('area').value;$('round2').textContent=session.name;$('login').classList.add('hide');$('work').classList.remove('hide');$('code').focus()};$('change').onclick=()=>location.reload();$('code').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();lookup()}});$('lookup').onclick=lookup;$('save').onclick=save;
async function lookup(){let code=$('code').value.trim();if(!code)return;selected=null;$('qtyBox').classList.add('hide');try{let x=await rpc('sc_lookup',{p_token:token,p_code:code});if(!x.found){$('product').querySelector('.muted').textContent='ไม่พบสินค้า';$('selectedCode').textContent='';$('selectedName').textContent='';$('code').select();return}selected=x;$('product').querySelector('.muted').textContent='พบสินค้าแล้ว • ใส่จำนวนก่อนบันทึก';$('selectedCode').textContent=x.code;$('selectedName').textContent=x.product_name;$('qty').value='';$('qtyBox').classList.remove('hide');$('qty').focus()}catch(e){alert('ค้นหาไม่สำเร็จ')}}
async function save(){if(!selected)return;let qty=Number($('qty').value);if(!Number.isFinite(qty)||qty<=0){$('qty').focus();return}try{let x=await rpc('sc_count',{p_token:token,p_code:selected.code,p_operator:operator,p_area:$('area').value,p_qty:qty});lastEvent=x.event_id;$('latest').innerHTML='<b>'+esc(x.code)+'</b> +'+qty;$('product').querySelector('.muted').textContent='✓ บันทึก '+qty+' ชิ้นแล้ว';$('selectedCode').textContent='';$('selectedName').textContent='';$('qtyBox').classList.add('hide');selected=null;$('code').value='';$('code').focus()}catch(e){alert('บันทึกไม่สำเร็จ')}}
$('undo').onclick=async()=>{if(!lastEvent)return;let ok=await rpc('sc_undo',{p_token:token,p_event:lastEvent,p_operator:operator});if(ok){$('latest').innerHTML='<b>—</b>';lastEvent=null}$('code').focus()};init();
</script></body></html>
