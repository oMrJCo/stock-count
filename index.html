<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>ตรวจนับสต็อก</title>
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:#f3f6fa;color:#14213d}.top{height:44px;background:#102f5f;color:#fff;padding:8px 12px;display:flex;align-items:center;justify-content:space-between}.screen{height:calc(100svh - 44px);max-width:520px;margin:auto;padding:7px;display:grid;grid-template-rows:auto minmax(0,1fr) auto;gap:7px;overflow:hidden}.card{background:#fff;border:1px solid #d9e2ef;border-radius:13px;padding:9px}.login{display:block;height:auto;margin:16px auto;max-width:480px}.login>*{width:100%;margin:5px 0}.hide{display:none!important}input,select,button{font:inherit;font-size:16px;border-radius:10px;border:1px solid #cbd7e6;padding:11px}button{border:0;background:#1769df;color:#fff;font-weight:800}.secondary{background:#edf3fa;color:#18375f}.bad{color:#c93434}.muted{color:#6d7b91}.status{font-size:12px}.last{display:flex;align-items:center;justify-content:space-between}.workarea{display:flex;flex-direction:column;min-height:0;gap:7px}.camera{position:relative;flex:1;min-height:180px;background:#07101d;border-radius:12px;overflow:hidden}.camera #reader{width:100%;height:100%}.camera video{width:100%!important;height:100%!important;object-fit:cover}.scanline{pointer-events:none;position:absolute;inset:17% 8%;border:2px solid #fff;border-radius:14px;box-shadow:0 0 0 999px rgba(0,0,0,.16)}.camlabel{position:absolute;left:50%;bottom:10px;transform:translateX(-50%);background:rgba(0,0,0,.62);color:#fff;border-radius:20px;padding:6px 12px;font-size:13px;white-space:nowrap}.actions{display:flex;gap:7px}.actions button{flex:1}.manual{display:flex;gap:7px}.manual input{min-width:0;flex:1}.productbox{background:#fff;border:1px solid #d9e2ef;border-radius:12px;padding:10px;text-align:center}.code{font-size:14px;color:#6d7b91}.name{font-size:20px;font-weight:900;line-height:1.2;margin:4px 0 8px}.qtyrow{display:flex;gap:8px;align-items:stretch}.qty{width:105px;text-align:center;font-size:28px;font-weight:900}.okbtn{flex:1;font-size:20px}.hint{font-size:13px;color:#6d7b91}.success{font-weight:800;color:#15864b}.lang{display:flex;gap:4px;margin-left:auto;margin-right:8px}.lang button{padding:5px 8px;font-size:12px;background:#fff;color:#102f5f}.lang button.on{background:#ffd84d;color:#10213c}
</style></head><body>
<header class="top"><b id="topTitle">📦 ตรวจนับสต็อก</b><div class="lang"><button id="thBtn">TH</button><button id="zhBtn">中文</button></div><span id="branch">—</span></header>
<div id="login" class="card login"><h2 id="loginTitle">เริ่มตรวจนับ</h2><div id="round" class="muted">กำลังโหลดรอบ...</div><input id="worker" placeholder="ชื่อผู้ตรวจนับ"><input id="area" type="hidden" value=""><button id="start">เริ่มตรวจนับ</button><div id="err" class="bad"></div></div>
<main id="work" class="screen hide">
<section class="card last"><div><b id="identity"></b><div id="round2" class="muted status"></div></div><button id="change" class="secondary">เปลี่ยน</button></section>
<section class="workarea">
<div id="camera" class="camera"><div id="reader"></div><div class="scanline"></div><div id="camlabel" class="camlabel">กำลังเปิดกล้อง…</div></div>
<div class="actions"><button id="cameraMode">📷 กล้อง</button><button id="gunMode" class="secondary">▥ เครื่องยิง</button></div><div id="cameraActions" class="actions"><button id="scanBtn">สแกน</button><button id="manualBtn" class="secondary">พิมพ์รหัส</button></div>
<div id="manualBox" class="manual hide"><input id="code" placeholder="พิมพ์ Barcode / รหัสสินค้า" autocomplete="off"><button id="manualGo">ตกลง</button></div>
<div id="productBox" class="productbox hide"><div id="selectedCode" class="code"></div><div id="selectedName" class="name"></div><div class="qtyrow"><input id="qty" class="qty" type="number" inputmode="numeric" min="0" placeholder="จำนวน"><button id="save" class="okbtn">ตกลง</button></div></div>
</section>
<section class="card last"><div><small id="latestLabel" class="muted">ล่าสุด</small><div id="latest"><b>—</b></div></div><button id="undo" class="secondary">↶ ย้อน</button></section>
</main>
<script>
let lang=localStorage.getItem('sc_lang')||'th';const TX={th:{top:'📦 ตรวจนับสต็อก',login:'เริ่มตรวจนับ',worker:'ชื่อผู้ตรวจนับ',start:'เริ่มตรวจนับ',change:'เปลี่ยน',scan:'สแกน',manual:'พิมพ์รหัส',manualph:'พิมพ์ Barcode / รหัสสินค้า',ok:'ตกลง',qty:'จำนวน',latest:'ล่าสุด',undo:'↶ ย้อน',camera:'📷 กล้อง',gun:'▥ เครื่องยิง',opening:'กำลังเปิดกล้อง…',aim:'เล็งบาร์โค้ดให้อยู่ในกรอบ',camfail:'เปิดกล้องไม่ได้ • ใช้พิมพ์รหัสแทน',searching:'กำลังค้นหา…',notfound:'ไม่พบสินค้า • สแกนใหม่',found:'พบสินค้าแล้ว • ใส่จำนวน',searchfail:'ค้นหาไม่สำเร็จ',needname:'ใส่ชื่อผู้ตรวจนับก่อน',nolink:'ลิงก์นี้ยังไม่ได้ผูกกับรอบตรวจนับ',noround:'ไม่พบรอบตรวจนับ',closed:'ปิดรอบแล้ว',saved:'บันทึก',savefail:'บันทึกไม่สำเร็จ'},zh:{top:'📦 库存盘点',login:'开始盘点',worker:'盘点人员姓名',start:'开始盘点',change:'更换',scan:'扫描',manual:'手动输入',manualph:'输入条码 / 商品编码',ok:'确认',qty:'数量',latest:'最近记录',undo:'↶ 撤销',camera:'📷 相机',gun:'▥ 扫码枪',opening:'正在打开相机…',aim:'请将条码对准扫描框',camfail:'无法打开相机 • 请手动输入',searching:'正在查找…',notfound:'未找到商品 • 请重新扫描',found:'已找到商品 • 请输入数量',searchfail:'查找失败',needname:'请先输入盘点人员姓名',nolink:'此链接尚未绑定盘点任务',noround:'未找到盘点任务',closed:'已关闭',saved:'已保存',savefail:'保存失败'}};const t=k=>TX[lang][k]||k;function applyLang(){document.documentElement.lang=lang==='zh'?'zh-CN':'th';$('topTitle').textContent=t('top');$('loginTitle').textContent=t('login');$('worker').placeholder=t('worker');$('start').textContent=t('start');$('change').textContent=t('change');$('scanBtn').textContent=t('scan');$('manualBtn').textContent=t('manual');$('code').placeholder=t('manualph');$('manualGo').textContent=t('ok');$('qty').placeholder=t('qty');$('save').textContent=t('ok');$('latestLabel').textContent=t('latest');$('undo').textContent=t('undo');$('cameraMode').textContent=t('camera');$('gunMode').textContent=t('gun');$('thBtn').classList.toggle('on',lang==='th');$('zhBtn').classList.toggle('on',lang==='zh')}function setLang(x){lang=x;localStorage.setItem('sc_lang',x);applyLang();if(session){$('round').textContent=session.name+' • '+session.count_date+(session.status!=='open'?' • '+t('closed'):'')}}
const API="https://dxlngxkuggbgdzmithzx.supabase.co/rest/v1/rpc/",KEY="sb_publishable_sqAwuko-g-Kgzp51YyMT3g_gIAwtEan";const token=new URLSearchParams(location.search).get('s');let session=null,lastEvent=null,operator='',selected=null,scanner=null,scanning=false,busy=false,mode='camera';const $=id=>document.getElementById(id);
async function rpc(fn,body){let r=await fetch(API+fn,{method:'POST',headers:{'Content-Type':'application/json','apikey':KEY},body:JSON.stringify(body)});if(!r.ok)throw new Error(await r.text());return r.json()}
function esc(s){return String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
async function init(){if(!token){$('round').textContent=t('nolink');$('start').disabled=true;return}try{session=await rpc('sc_counter_info',{p_token:token});if(!session)throw 0;$('branch').textContent=session.branch||'Stock Count';$('round').textContent=session.name+' • '+session.count_date+(session.status!=='open'?' • '+t('closed'):'');$('area').value='';if(session.status!=='open')$('start').disabled=true}catch(e){$('round').textContent=t('noround');$('start').disabled=true}}
$('start').onclick=async()=>{operator=$('worker').value.trim();if(!operator)return $('err').textContent=t('needname');$('identity').textContent=operator;$('round2').textContent=session.name;$('login').classList.add('hide');$('work').classList.remove('hide');await startCamera()};
$('change').onclick=()=>location.reload();
async function startCamera(){if(scanning)return;try{if(!scanner)scanner=new Html5Qrcode("reader");await scanner.start({facingMode:"environment"},{fps:12,qrbox:{width:280,height:150},aspectRatio:1.777},onScan,()=>{});scanning=true;$('camlabel').textContent=t('aim')}catch(e){$('camlabel').textContent=t('camfail')}}
async function pauseScan(){busy=true;$('camlabel').textContent=t('found')}
function resumeScan(){selected=null;busy=false;$('productBox').classList.add('hide');$('qty').value='';$('camlabel').textContent='เล็งบาร์โค้ดให้อยู่ในกรอบ'}
async function onScan(code){if(busy||selected)return;await lookup(String(code).trim())}
async function lookup(code){if(!code||busy)return;busy=true;$('camlabel').textContent=t('searching');try{let x=await rpc('sc_lookup',{p_token:token,p_code:code});if(!x.found){$('camlabel').textContent=t('notfound');setTimeout(()=>{busy=false;$('camlabel').textContent='เล็งบาร์โค้ดให้อยู่ในกรอบ'},900);return}selected=x;$('selectedCode').textContent=x.code;$('selectedName').textContent=x.product_name;$('qty').value='';$('productBox').classList.remove('hide');$('camlabel').textContent=t('found');$('qty').focus()}catch(e){$('camlabel').textContent=t('searchfail');setTimeout(()=>busy=false,900)}}
$('scanBtn').onclick=()=>{if(selected)resumeScan();else{busy=false;$('camlabel').textContent='เล็งบาร์โค้ดให้อยู่ในกรอบ';startCamera()}};
$('manualBtn').onclick=()=>{$('manualBox').classList.toggle('hide');if(!$('manualBox').classList.contains('hide'))$('code').focus()};
$('manualGo').onclick=()=>{let v=$('code').value.trim();$('code').value='';if(mode!=='gun')$('manualBox').classList.add('hide');busy=false;lookup(v)};
$('code').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();$('manualGo').click()}});
$('save').onclick=async()=>{if(!selected)return;let qty=Number($('qty').value);if(!Number.isFinite(qty)||qty<0){$('qty').focus();return}let item=selected;try{let x=await rpc('sc_count',{p_token:token,p_code:item.code,p_operator:operator,p_area:$('area').value,p_qty:qty});lastEvent=x.event_id;$('latest').innerHTML='<b>'+esc(x.code)+'</b> +'+qty;$('camlabel').textContent='✓ '+t('saved')+' '+qty;$('productBox').classList.add('hide');selected=null;$('qty').value='';setTimeout(()=>{busy=false;$('camlabel').textContent='เล็งบาร์โค้ดให้อยู่ในกรอบ'},350)}catch(e){$('camlabel').textContent=t('savefail');$('qty').focus()}};
$('qty').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();$('save').click()}});
$('undo').onclick=async()=>{if(!lastEvent)return;let ok=await rpc('sc_undo',{p_token:token,p_event:lastEvent,p_operator:operator});if(ok){$('latest').innerHTML='<b>—</b>';lastEvent=null}};
$('thBtn').onclick=()=>setLang('th');$('zhBtn').onclick=()=>setLang('zh');applyLang();init();
</script></body></html>
